name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate source Markdown
        run: python3 scripts/validate.py

      - name: Check generated Starlight content
        run: python3 scripts/sync_starlight_content.py --check

      - name: Test validation and generation helpers
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test security policy examples
        run: python3 scripts/test_security_policies.py

      - name: Install, build, and upload site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          path: site
          node-version: 22.23.2
          package-manager: npm@10.9.8

      - name: Validate generated links and anchors
        run: python3 scripts/validate_site.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
